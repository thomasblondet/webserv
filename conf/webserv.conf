server {
    listen 127.0.0.1:8080;
    root ./site;
    index index.html;
    client_max_body_size 1000000;

    location / {
        limit_except GET;
    }

    location /uploads/ {
        autoindex on;
        upload_store ./site;
        limit_except GET POST DELETE;
    }

    location /cgi/ {
        cgi_handler .py /usr/bin/python3;
        limit_except GET POST;
    }
}
